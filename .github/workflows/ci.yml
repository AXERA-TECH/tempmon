name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify release metadata
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          test -n "$version"
          test -s LICENSE
          grep -F "#define AGENT_VERSION \"${version}\"" tempmon.c

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run Python tests
        run: python3 -m unittest discover -v

      - name: Build board agent
        run: |
          set -euo pipefail
          gcc -O2 -Wall -Wextra -Werror -pthread -o /tmp/tempmon tempmon.c
          file /tmp/tempmon

      - name: Package source
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          git archive --format=tar.gz --output="tempmon-${version}.tar.gz" HEAD
          ls -lh "tempmon-${version}.tar.gz"

      - name: Reject conflict markers and whitespace errors
        run: |
          set -euo pipefail
          if grep -R -n -E '^(<<<<<<<|=======$|>>>>>>>)' \
            README.md docs tempmon.c monitor.py bench_sample.py test_*.py boards.example.json .github; then
            echo "::error::Unresolved conflict markers found"
            exit 1
          fi
          git diff --check

      - name: Reject internal network addresses and credentials
        run: |
          set -euo pipefail
          if git grep -n -E \
            '(^|[^0-9])(10\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}|172\.(1[6-9]|2[0-9]|3[01])\.[0-9]{1,3}\.[0-9]{1,3}|192\.168\.[0-9]{1,3}\.[0-9]{1,3}|169\.254\.[0-9]{1,3}\.[0-9]{1,3}|f[cd][0-9a-f]{2}:)' \
            -- . ':!.github/workflows/ci.yml'; then
            echo "::error::Internal address found in tracked source"
            exit 1
          fi
          if git grep -n -Ei 'password|passwd|Axera#1234|123456' \
            -- . ':!.github/workflows/ci.yml'; then
            echo "::error::Credential-like literal found in tracked source"
            exit 1
          fi

      - name: Smoke-test aggregator API and Web UI
        run: |
          set -euo pipefail
          TEMPMON_CONFIG="$PWD/boards.example.json" \
          TEMPMON_REGISTRATIONS="$RUNNER_TEMP/registrations.json" \
          TEMPMON_MONITOR_PORT=18888 \
            python3 monitor.py > "$RUNNER_TEMP/tempmon-monitor.log" 2>&1 &
          monitor_pid=$!
          cleanup() {
            kill "$monitor_pid" 2>/dev/null || true
            wait "$monitor_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for _ in $(seq 1 30); do
            body="$(curl --fail --silent http://127.0.0.1:18888/health || true)"
            if grep -q '"status": "ok"' <<<"$body"; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::Aggregator did not become ready"
            cat "$RUNNER_TEMP/tempmon-monitor.log"
            exit 1
          fi

          curl --fail --silent http://127.0.0.1:18888/ -o "$RUNNER_TEMP/index.html"
          curl --fail --silent http://127.0.0.1:18888/api/all -o "$RUNNER_TEMP/all.json"
          grep -q 'AX8860 Boards Monitor' "$RUNNER_TEMP/index.html"
          grep -q '"boards"' "$RUNNER_TEMP/all.json"

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: tempmon-source
          path: tempmon-*.tar.gz
          if-no-files-found: error

  build-aarch64:
    name: Build static aarch64 agent
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Cache Arm GNU Toolchain
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/tempmon-arm-gnu-toolchain-13.3.rel1
          key: arm-gnu-toolchain-13.3.rel1-x86_64-aarch64-none-linux-gnu

      - name: Build static aarch64 agent
        env:
          ARM_TOOLCHAIN_DIR: ${{ runner.temp }}/tempmon-arm-gnu-toolchain-13.3.rel1
        run: ./scripts/build-aarch64.sh

      - name: Upload aarch64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: tempmon-aarch64
          path: |
            dist/tempmon-*-linux-aarch64.tar.gz
            dist/tempmon-*-linux-aarch64.tar.gz.sha256
          if-no-files-found: error
